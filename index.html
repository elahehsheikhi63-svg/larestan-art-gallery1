
<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>نمایشگاه مجازی هنرستان هنرهای زیبا دخترانه لارستان</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        .instruction {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: white; padding: 10px 20px;
            border-radius: 20px; font-family: Tahoma; z-index: 10; pointer-events: none;
            direction: rtl; text-align: center;
        }
    </style>
</head>
<body>
    <div class="instruction">
        با کلیدهای WASD حرکت کنید و با موس بچرخید.<br>
        برای پخش ویدئو روی دکمه "پخش ویدئو" یا خود اثر کلیک کنید.
    </div>

    <a-scene cursor="rayOrigin: mouse">
        <a-assets>
            <img id="art1" src="art1.png">
            <img id="art2" src="art2.png">
            <img id="art3" src="art3.png">
            <img id="art4" src="art4.png">
            <img id="art5" src="art5.png">
            <img id="art6" src="art6.png">
            <img id="art7" src="art7.png">
            <img id="art8" src="art8.png">
            
            <img id="label1" src="labels/label1.png">
            <img id="label2" src="labels/label2.png">
            <img id="label3" src="labels/label3.png">
            <img id="label4" src="labels/label4.png">
            <img id="label5" src="labels/label5.png">
            <img id="label6" src="labels/label6.png">
            <img id="label7" src="labels/label7.png">
            <img id="label8" src="labels/label8.png">
            
            <img id="floorTex" src="https://cdn.aframe.io/a-blast/assets/images/floor.png">
        </a-assets>

        <!-- Environment -->
        <a-sky color="#050505"></a-sky>
        <a-plane position="0 0 0" rotation="-90 0 0" width="50" height="50" color="#111" material="roughness: 0.1; metalness: 0.5"></a-plane>

        <!-- Main Entrance Title -->
        <a-entity position="0 4 -12">
            <a-plane width="8" height="2" color="#1a1a1a" material="metalness:0.8">
                <a-text value="Honarestan Honar-haye Ziba Larestan" align="center" position="0 0.5 0.1" color="#C5A059" width="10"></a-text>
                <a-text value="Careers Week Exhibition - 1405" align="center" position="0 -0.4 0.1" color="white" width="6"></a-text>
            </a-plane>
        </a-entity>

        <!-- Wall 1 (Left) -->
        <a-box position="-6 2.5 -5" rotation="0 90 0" width="15" height="5" depth="0.1" color="#1a1a1a"></a-box>
        
        <!-- Artworks on Wall 1 -->
        <!-- Art 1 -->
        <a-entity position="-5.9 2.5 -2">
            <a-image src="#art1" width="2.5" height="1.8" rotation="0 90 0" class="clickable" onclick="openVideo('VIDEO_LINK_1')"></a-image>
            <a-image src="#label1" width="1.2" height="0.3" position="0.05 -1.2 0" rotation="0 90 0"></a-image>
            <a-plane color="#C5A059" width="1" height="0.25" position="0.05 -1.6 0" rotation="0 90 0" class="clickable" onclick="openVideo('https://s11.uupload.ir/files/raziie/چاپ%20دستی/ژوژمان%20چاپ%20دستی.mp4?play')">
                <a-text value="PLAY VIDEO" align="center" color="black" width="3"></a-text>
            </a-plane>
            <a-light type="spot" color="#fff" intensity="0.6" position="2 2 0" rotation="-45 90 0"></a-light>
        </a-entity>

        <!-- Art 2 -->
        <a-entity position="-5.9 2.5 -5">
            <a-image src="#art2" width="2.5" height="1.8" rotation="0 90 0" onclick="openVideo('VIDEO_LINK_2')"></a-image>
            <a-image src="#label2" width="1.2" height="0.3" position="0.05 -1.2 0" rotation="0 90 0"></a-image>
            <a-plane color="#C5A059" width="1" height="0.25" position="0.05 -1.6 0" rotation="0 90 0" onclick="openVideo('https://aparat.com/v/zpi4064')">
                <a-text value="PLAY VIDEO" align="center" color="black" width="3"></a-text>
            </a-plane>
        </a-entity>

        <!-- Art 3 -->
        <a-entity position="-5.9 2.5 -8">
            <a-image src="#art3" width="2.5" height="1.8" rotation="0 90 0" onclick="openVideo('VIDEO_LINK_3')"></a-image>
            <a-image src="#label3" width="1.2" height="0.3" position="0.05 -1.2 0" rotation="0 90 0"></a-image>
            <a-plane color="#C5A059" width="1" height="0.25" position="0.05 -1.6 0" rotation="0 90 0" onclick="openVideo('https://www.aparat.com/v/psjt1g3')">
                <a-text value="PLAY VIDEO" align="center" color="black" width="3"></a-text>
            </a-plane>
        </a-entity>

        <!-- Art 4 -->
        <a-entity position="-5.9 2.5 -11">
            <a-image src="#art4" width="2.5" height="1.8" rotation="0 90 0" onclick="openVideo('VIDEO_LINK_4')"></a-image>
            <a-image src="#label4" width="1.2" height="0.3" position="0.05 -1.2 0" rotation="0 90 0"></a-image>
            <a-plane color="#C5A059" width="1" height="0.25" position="0.05 -1.6 0" rotation="0 90 0" onclick="openVideo('https://www.aparat.com/v/twh7l5d')">
                <a-text value="PLAY VIDEO" align="center" color="black" width="3"></a-text>
            </a-plane>
        </a-entity>

        <!-- Wall 2 (Right) -->
        <a-box position="6 2.5 -5" rotation="0 -90 0" width="15" height="5" depth="0.1" color="#1a1a1a"></a-box>

        <!-- Artworks on Wall 2 -->
        <!-- Art 5 -->
        <a-entity position="5.9 2.5 -2">
            <a-image src="#art5" width="2.5" height="1.8" rotation="0 -90 0" onclick="openVideo('VIDEO_LINK_5')"></a-image>
            <a-image src="#label5" width="1.2" height="0.3" position="-0.05 -1.2 0" rotation="0 -90 0"></a-image>
            <a-plane color="#C5A059" width="1" height="0.25" position="-0.05 -1.6 0" rotation="0 -90 0" onclick="openVideo('https://aparat.com/v/ejx89g6')">
                <a-text value="PLAY VIDEO" align="center" color="black" width="3"></a-text>
            </a-plane>
        </a-entity>

        <!-- Art 6 -->
        <a-entity position="5.9 2.5 -5">
            <a-image src="#art6" width="2.5" height="1.8" rotation="0 -90 0" onclick="openVideo('VIDEO_LINK_6')"></a-image>
            <a-image src="#label6" width="1.2" height="0.3" position="-0.05 -1.2 0" rotation="0 -90 0"></a-image>
            <a-plane color="#C5A059" width="1" height="0.25" position="-0.05 -1.6 0" rotation="0 -90 0" onclick="openVideo('https://s25.uupload.ir/files/raziie/خط%20در%20گرافیک/ژوژمان%20خط%20در%20گرافیک.mp4?play')">
                <a-text value="PLAY VIDEO" align="center" color="black" width="3"></a-text>
            </a-plane>
        </a-entity>

        <!-- Art 7 -->
        <a-entity position="5.9 2.5 -8">
            <a-image src="#art7" width="2.5" height="1.8" rotation="0 -90 0" onclick="openVideo('VIDEO_LINK_7')"></a-image>
            <a-image src="#label7" width="1.2" height="0.3" position="-0.05 -1.2 0" rotation="0 -90 0"></a-image>
            <a-plane color="#C5A059" width="1" height="0.25" position="-0.05 -1.6 0" rotation="0 -90 0" onclick="openVideo('https://s9.uupload.ir/files/raziie/صفحه%20آرایی/ژوژمان%20صفحه%20آرایی.mp4?play')">
                <a-text value="PLAY VIDEO" align="center" color="black" width="3"></a-text>
            </a-plane>
        </a-entity>

        <!-- Art 8 -->
        <a-entity position="5.9 2.5 -11">
            <a-image src="#art8" width="2.5" height="1.8" rotation="0 -90 0" onclick="openVideo('VIDEO_LINK_8')"></a-image>
            <a-image src="#label8" width="1.2" height="0.3" position="-0.05 -1.2 0" rotation="0 -90 0"></a-image>
            <a-plane color="#C5A059" width="1" height="0.25" position="-0.05 -1.6 0" rotation="0 -90 0" onclick="openVideo('https://s11.uupload.ir/files/raziie/تصویرسازی/ژوژمان%20تصویرسازی%20.mp4?play')">
                <a-text value="PLAY VIDEO" align="center" color="black" width="3"></a-text>
            </a-plane>
        </a-entity>

        <!-- Lights -->
        <a-entity light="type: ambient; color: #444"></a-entity>
        <a-entity light="type: point; intensity: 0.8; distance: 20; decay: 2" position="0 5 -5"></a-entity>

        <!-- Camera -->
        <a-entity movement-controls position="0 1.6 5">
            <a-entity camera look-controls></a-entity>
        </a-entity>
    </a-scene>

    <script>
        function openVideo(url) {
            if(url.includes('VIDEO_LINK')) {
                alert('لطفاً ابتدا لینک ویدیو را در فایل index.html جایگزین کنید.');
            } else {
                window.open(url, '_blank');
            }
        }
    </script>
</body>
</html>
